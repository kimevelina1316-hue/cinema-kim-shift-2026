<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Шифт Кинотеатр</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <header class="header-section">
      <div class="d-flex justify-content-between align-items-center">
       
        <div class="logo">
          <img src="images/Logo_Cinema.svg">
        </div>
        
       <div class="d-flex gap-2">
          <a href="profile.html" class="nav-link-custom">
            <img src="images/Profile.svg" alt="Профиль">
            <span>Профиль</span>
          </a>
          <a href="билеты.html" class="nav-link-custom">
            <img src="images/Tickets.svg" alt="Билеты">
            <span>Билеты</span>
          </a>
        </div>
        
        
        <div class="d-flex gap-2">
          <a href="index.html" class="nav-link-custom">
            <img src="images/Exit.svg" alt="Выход">
            <span>Выход</span>
          </a>
          <a href="#" class="nav-link-custom">
            <img src="images/Vector.svg" alt="Солнце">
          </a>
        </div>
        
      </div>
    </header>

    
    <main class="afisha">
      <h1 class="mb-4">Афиша</h1>
      
      
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        
        
        <div class="col">
          <div class="film-card" onclick="openFilm()">
            <img src="images/venom.jpg" alt="Веном 2">
            <div class="film-info">
              <h3 class="film-title">Веном 2 (16+)</h3>
              <p class="film-genre">Боевик</p>
              <p class="film-year">США, 2023</p>
              <div class="rating">
                <span>★★★★☆</span>
                <span>Кинорейтинг: 8.4</span>
              </div>
              <button class="btn btn-purple w-100">Подробнее</button>
            </div>
          </div>
        </div>

        
        <div class="col">
          <div class="film-card" onclick="openFilm()">
            <img src="images/soika.jpg" alt="Голодные игры">
            <div class="film-info">
              <h3 class="film-title">Голодные игры (12+)</h3>
              <p class="film-genre">Антиутопия</p>
              <p class="film-year">США, 2023</p>
              <div class="rating">
                <span>★★★★☆</span>
                <span>Кинорейтинг: 8.4</span>
              </div>
              <button class="btn btn-purple w-100">Подробнее</button>
            </div>
          </div>
        </div>

        
        <div class="col">
          <div class="film-card" onclick="openFilm()">
            <img src="images/spider.jpg" alt="Человек-паук">
            <div class="film-info">
              <h3 class="film-title">Человек-паук</h3>
              <p class="film-genre">Фантастика, приключения</p>
              <p class="film-year">США, 2023</p>
              <div class="rating">
                <span>★★★★☆</span>
                <span>Кинорейтинг: 8.4</span>
              </div>
              <button class="btn btn-purple w-100">Подробнее</button>
            </div>
          </div>
        </div>
        
      </div>
    </main>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  
  <script>
    function openFilm() {
      window.location.href = 'film.html';
    }
  </script>
</body>
</html>
